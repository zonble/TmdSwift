name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  build-linux:
    name: Build Linux (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner_arch: amd64
            swift_image: swift:6.0-jammy
          - arch: aarch64
            runner_arch: arm64
            swift_image: swift:6.0-jammy

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU (for cross-arch emulation)
        if: matrix.arch == 'aarch64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build static binary in Swift Docker image
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then VERSION="$GITHUB_REF_NAME"; fi
          docker run --rm --platform linux/${{ matrix.runner_arch }} \
            -v "$PWD:/workspace" -w /workspace \
            ${{ matrix.swift_image }} \
            sh -c "
              apt-get update -qq && apt-get install -y -qq binutils > /dev/null 2>&1
              swift build -c release --static-swift-stdlib -Xswiftc -Osize
              strip --strip-all .build/release/tmd
              tar -czvf /workspace/tmd-linux-${{ matrix.arch }}.tar.gz -C .build/release tmd
            "

      - name: Upload binary archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: tmd-linux-${{ matrix.arch }}
          path: tmd-linux-${{ matrix.arch }}.tar.gz

  build-macos:
    name: Build macOS (Universal Binary)
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Universal Binary
        run: |
          swift build -c release -Xswiftc -Osize --arch arm64 --arch x86_64
          mkdir -p dist
          cp .build/apple/Products/Release/tmd dist/tmd
          strip dist/tmd
          tar -czvf tmd-macos-universal.tar.gz -C dist tmd

      - name: Upload macOS archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: tmd-macos-universal
          path: tmd-macos-universal.tar.gz

  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Swift Toolchain
        shell: pwsh
        run: |
          try { winget source reset --force } catch {}
          try { winget source update } catch {}
          winget install --id Swift.Toolchain --exact --source winget --accept-package-agreements --accept-source-agreements --disable-interactivity

          $swiftBin = Get-ChildItem -Path `
            "$env:LOCALAPPDATA\Programs\Swift\Toolchains\*\usr\bin", `
            "$env:ProgramFiles\Swift\Toolchains\*\usr\bin" `
            -Directory -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $swiftBin) {
            throw "Swift toolchain was installed by winget, but no Swift usr\bin directory was found."
          }

          $swiftRoot = Split-Path -Parent (Split-Path -Parent (Split-Path -Parent (Split-Path -Parent $swiftBin.FullName)))
          $swiftSdk = Get-ChildItem -Path "$swiftRoot\Platforms\*\Windows.platform\Developer\SDKs\Windows.sdk" -Directory -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $swiftSdk) {
            throw "Swift toolchain was installed by winget, but no Windows.sdk directory was found under $swiftRoot."
          }

          $swiftUsrBins = Get-ChildItem -Path $swiftRoot -Recurse -Directory -Filter bin -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -like "*\usr\bin" }
          $swiftPathPrefix = ($swiftUsrBins | ForEach-Object { $_.FullName }) -join ";"

          $swiftBin.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "$($swiftSdk.FullName)\usr\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "SWIFT_BIN=$($swiftBin.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SWIFT_SDKROOT=$($swiftSdk.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SWIFT_PATH_PREFIX=$swiftPathPrefix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Release Binary
        shell: pwsh
        run: |
          $pathValue = [Environment]::GetEnvironmentVariable('Path', 'Process')
          if (-not $pathValue) { $pathValue = [Environment]::GetEnvironmentVariable('PATH', 'Process') }
          Remove-Item Env:PATH -ErrorAction SilentlyContinue
          Remove-Item Env:Path -ErrorAction SilentlyContinue
          $env:SDKROOT = $env:SWIFT_SDKROOT
          $env:Path = "$env:SWIFT_PATH_PREFIX;$pathValue"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsInstallPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module "$vsInstallPath\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vsInstallPath -SkipAutomaticLocation -DevCmdArguments "-arch=x64 -host_arch=x64"
          & "$env:SWIFT_BIN\swift.exe" build -c release -Xswiftc -Osize
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          $releaseBinPath = & "$env:SWIFT_BIN\swift.exe" build -c release --show-bin-path
          Copy-Item -Path "$releaseBinPath\tmd.exe" -Destination "artifacts\tmd.exe" -Force

          # Bundle essential Swift, Foundation, Concurrency & VC++ Runtime DLLs into release directory
          $dllSources = @(
              "$env:SWIFT_BIN",
              "$env:SWIFT_SDKROOT\usr\bin",
              "$env:SWIFT_SDKROOT\bin",
              "$env:SWIFT_SDKROOT\..\bin"
          )
          $dllSources += Get-ChildItem -Path "$env:LOCALAPPDATA\Programs\Swift", "$env:ProgramFiles\Swift" -Recurse -Directory -Filter bin -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
          if ($vsInstallPath) {
              $vcRedistDirs = Get-ChildItem -Path "$vsInstallPath\VC\Redist\MSVC" -Recurse -Directory -Filter "x64" -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
              $dllSources += $vcRedistDirs
          }
          $dllSources += "$env:SystemRoot\System32"

          $runtimePatterns = @(
              "swift*.dll",
              "_swift*.dll",
              "Foundation*.dll",
              "_Foundation*.dll",
              "*icu*.dll",
              "dispatch*.dll",
              "_dispatch*.dll",
              "BlocksRuntime*.dll",
              "vcruntime*.dll",
              "msvcp*.dll",
              "mimalloc*.dll",
              "z*.dll"
          )

          $excludeNames = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
          $excludedList = @(
              "FoundationMacros",
              "FoundationNetworking",
              "SwiftBasicFormat",
              "SwiftBuild",
              "SwiftCompilerPluginMessageHandling",
              "swiftDemangle",
              "SwiftDiagnostics",
              "swiftDistributed",
              "SwiftDocC",
              "SwiftDriver",
              "SwiftFormat",
              "SwiftIDEUtils",
              "SwiftIfConfig",
              "SwiftInProcPluginServer",
              "SwiftLibraryPluginProvider",
              "SwiftMacros",
              "swiftObservation",
              "SwiftOperators",
              "SwiftOptions",
              "SwiftParser",
              "SwiftParserDiagnostics",
              "SwiftRefactor",
              "swiftRegexBuilder",
              "swiftRemoteMirror",
              "SwiftSDKCommand",
              "SwiftSourceKitClientPlugin",
              "SwiftSourceKitPlugin",
              "swiftSwiftOnoneSupport",
              "swiftSynchronization",
              "SwiftSyntax",
              "SwiftSyntaxBuilder",
              "SwiftSyntaxMacroExpansion",
              "SwiftSyntaxMacros",
              "swift_Differentiation"
          )
          foreach ($item in $excludedList) {
              [void]$excludeNames.Add($item)
              [void]$excludeNames.Add("$item.dll")
          }

          $copiedDlls = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
          foreach ($src in $dllSources) {
              if (Test-Path $src) {
                  foreach ($pattern in $runtimePatterns) {
                      Get-ChildItem -Path $src -Filter $pattern -ErrorAction SilentlyContinue | ForEach-Object {
                          if (-not $excludeNames.Contains($_.BaseName) -and -not $excludeNames.Contains($_.Name) -and -not $copiedDlls.Contains($_.Name)) {
                              Copy-Item -Path $_.FullName -Destination "artifacts\" -Force
                              [void]$copiedDlls.Add($_.Name)
                          }
                      }
                  }
              }
          }

          Compress-Archive -Path "artifacts\*" -DestinationPath "artifacts\tmd-windows-x64.zip" -Force
          Get-ChildItem -Path artifacts -Exclude "tmd-windows-x64.zip" | Remove-Item -Recurse -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tmd-windows-x64
          path: artifacts/tmd-windows-x64.zip

  release:
    name: Create GitHub Release
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts/

      - name: Generate checksums
        working-directory: artifacts
        run: |
          sha256sum tmd-linux-*.tar.gz tmd-macos-universal.tar.gz tmd-windows-x64.zip > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: TMD ${{ github.ref_name }}
          files: |
            artifacts/tmd-linux-*.tar.gz
            artifacts/tmd-macos-universal.tar.gz
            artifacts/tmd-windows-x64.zip
            artifacts/checksums.txt
          draft: false
          prerelease: false
